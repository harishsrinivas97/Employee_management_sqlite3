{% extends "base.html" %}

{% block title %}Sign In - EmployeeHub{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-right-to-bracket"></i></div>
            <h2>Welcome Back</h2>
            <p>Sign in to your manager account to continue</p>
        </div>
        <form action="/verify" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="name@company.com" required autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn-primary btn-full">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>
        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Sign Up</a></p>
            <p><a href="/forgot_password">Forgot Password?</a></p>
        </div>
    </div>
</div>
{% endblock %}
