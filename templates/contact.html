{% extends "base.html" %}

{% block title %}Contact Us - EmployeeHub{% endblock %}

{% block content %}
<section class="contact-section" id="contact">
    <div class="contact-container">
        <div class="contact-header">
            <div style="display: inline-flex; align-items: center; gap: 8px; background: #eef2ff; color: #4f46e5; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 9999px; margin-bottom: 12px; border: 1px solid #c7d2fe;">
                <i class="fas fa-envelope"></i> Get In Touch
            </div>
            <h2>Contact Our Team</h2>
            <p>Have questions, need assistance, or want custom workforce solutions? Send us a message below.</p>
        </div>

        <div class="contact-card">
            <form action="{{ url_for('contact') }}" method="POST">
                <div class="contact-grid">
                    <div class="form-group">
                        <label for="contact-name">Your Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="contact-name" name="name" placeholder="John Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="contact-email" name="email" placeholder="name@company.com" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact-subject">Subject</label>
                    <div class="input-wrapper">
                        <i class="fas fa-tag"></i>
                        <input type="text" id="contact-subject" name="subject" placeholder="How can we help?" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact-message">Message</label>
                    <div class="input-wrapper textarea-wrapper">
                        <i class="fas fa-comment-dots"></i>
                        <textarea id="contact-message" name="message" rows="4" placeholder="Write your message here..." required></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-full">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
