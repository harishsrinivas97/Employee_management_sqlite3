{% extends "base.html" %}

{% block title %}Reset Password - Employee Management{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-lock-open"></i></div>
            <h2>Reset Password</h2>
            <p>Enter your new password below</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter new password" required minlength="8">
                </div>
            </div>
            <button type="submit" class="btn-primary btn-full">Reset Password</button>
        </form>
        <div class="auth-footer">
            <p>Back to <a href="/login">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
