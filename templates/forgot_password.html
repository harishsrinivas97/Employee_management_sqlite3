{% extends "base.html" %}

{% block title %}Forgot Password - Employee Management{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-key"></i></div>
            <h2>Forgot Password</h2>
            <p>Enter your registered email to receive a reset link</p>
        </div>
        <form action="{{ url_for('send_reset_link') }}" method="POST">
            <div class="form-group">
                <label for="email">Registered Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
                </div>
            </div>
            <button type="submit" class="btn-primary btn-full">Send Reset Link</button>
        </form>
        <div class="auth-footer">
            <p>Remember your password? <a href="/login">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
